# ============================================================
# 评分档案配置
#
# 权重是业务策略，不是代码常量。改这里不需要动 Python 代码。
# 加载与校验见 app/domain/policies.py，规则：
#   1) 每个档案的六维权重和必须 == 1.0（容差 1e-6），否则服务拒绝启动。
#      不做静默归一化——那会让调参的人以为自己的配置生效了。
#   2) semantic.weight 不是"第七个维度"，而是语义分在最终分里占的比例：
#      overall = 六维加权分 × (1 - semantic.weight) + 语义分 × semantic.weight
#   3) 维度名只能是 skill / industry / location / salary / education / tag。
#      拼错字段名（如 weigth）会直接报错，不会被静默忽略。
# ============================================================

version: 1
default_profile: tech

profiles:

  tech:                              # 技术岗：技能与行业主导
    dims:
      skill:     { weight: 0.40 }   # 技能权重 40%
      education: { weight: 0.15 }   # 学历权重 15%
      location:  { weight: 0.15 }   # 地域权重 15%
      industry:  { weight: 0.10 }   # 行业权重 10%
      salary:    { weight: 0.10 }   # 薪资权重 10%
      tag:       { weight: 0.10 }   # 标签权重 10%
      # 合计 1.00
    semantic: { weight: 0.20 }       # 语义相似度分占最终分的 20%
    recall:
      top_k: 100                     # 向量召回条数；结构化过滤在召回之后做
      min_similarity: 0.30           # 低于此相似度的候选直接不进候选池
    unknown_field_policy: keep       # 字段缺失：keep | reject | score_only
    analyze_top_n: 10                # 只对前 10 名调用 LLM 写报告

  sales:                             # 销售岗：行业与标签主导
    dims:
      skill:     { weight: 0.15 }
      industry:  { weight: 0.30 }
      location:  { weight: 0.20 }
      salary:    { weight: 0.10 }
      education: { weight: 0.05 }
      tag:       { weight: 0.20 }    # 合计 1.00
    semantic: { weight: 0.15 }
    recall:    { top_k: 100, min_similarity: 0.25 }
    unknown_field_policy: keep
    analyze_top_n: 10

  strict:                            # 严招：缺失字段直接淘汰
    inherits: tech                   # 其余字段全部继承 tech，只覆盖下面两项
    unknown_field_policy: reject
    recall: { top_k: 200, min_similarity: 0.40 }
